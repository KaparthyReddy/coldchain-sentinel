services:
  postgres:
    image: postgres:16-alpine
    container_name: coldchain-postgres
    environment:
      POSTGRES_DB: coldchain
      POSTGRES_USER: coldchain_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_locally}
    ports:
      - "5432:5432"
    volumes:
      - coldchain_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coldchain_user -d coldchain"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: coldchain-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/coldchain
      DB_USERNAME: coldchain_user
      DB_PASSWORD: ${DB_PASSWORD:-change_me_locally}
      JWT_SECRET: ${JWT_SECRET:-change_me_to_a_long_random_string_at_least_32_chars}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  coldchain_pgdata:
