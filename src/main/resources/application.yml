spring:
  application:
    name: coldchain-sentinel

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/coldchain}
    username: ${DB_USERNAME:coldchain_user}
    password: ${DB_PASSWORD:change_me_locally}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:change_me_to_a_long_random_string_at_least_32_chars}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  
razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.coldchainsentinel: DEBUG
